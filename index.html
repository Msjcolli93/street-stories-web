<!-- Sprint 6: items, ATM skim loop, weather -->

<body>
<div id="app" class="mx-auto max-w-7xl p-3 sm:p-4"></div>
<script>
"use strict";
/* ============ MODEL ============ */
const TIMES = Object.freeze(["Morning", "Afternoon", "Night"]);
const STAT_LIMITS = Object.freeze({
  health: [0, 100], energy: [0, 100], cash: [0, Infinity],
  streetCred: [0, 100], intellect: [0, 100], heat: [0, 100]
});
const MAX_CHRONICLE = 200;

const defaultState = {
  meta: { version: "1.0.0", day: 1, timeOfDay: "Morning", turnCount: 1, status: "creating", ending: null, totalEarned: 0, encounters: 0, coldStreak: 0 },
  player: {
    name: "Player", origin: "Street Hustler", traits: [], strikes: 0, maxHealth: 100,
    stats: { health: 100, energy: 100, cash: 150, streetCred: 10, intellect: 10, heat: 0 },
    inventory: []
  },
  world: {
    currentDistrict: "Market St Safehouse",
    districts: ["Market St Safehouse", "Corner Bodega", "The Chop Shop", "Downtown Strip"],
    activeFlags: {}, weather: "Clear", activeOperations: {}, celebration: null,
    districtHeat: { "Market St Safehouse": 0, "Corner Bodega": 0, "The Chop Shop": 0, "Downtown Strip": 0 },
    factions: { westside: { rep: 0 }, downtown: { rep: 0 }, council: { rep: 0 } }
  },
  narrativeSeeds: [], activeContract: null, phone: { messages: [] },
  chronicle: [{ day: 1, time: "Morning", event: "Started out on Market Street with $150 and an empty ledger." }]
};

const clone = (v) => (typeof structuredClone === "function" ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
const deepFreeze = (o) => { if (o && typeof o === "object" && !Object.isFrozen(o)) { Object.freeze(o); Object.values(o).forEach(deepFreeze); } return o; };
const clampStat = (key, val, maxH) => {
  const lim = key === "health" && maxH ? [0, maxH] : STAT_LIMITS[key];
  if (!lim) throw new RangeError(`Unknown stat "${key}"`);
  if (!Number.isFinite(val)) throw new TypeError(`Stat "${key}" must be a finite number`);
  return Math.min(lim[1], Math.max(lim[0], Math.round(val)));
};

/** Validates an untrusted state object (e.g. from storage). Throws on failure. */
function validateState(s) {
  const fail = (m) => { throw new TypeError(`Invalid state: ${m}`); };
  if (!s || typeof s !== "object") fail("not an object");
  const { meta, player, world, chronicle } = s;
  if (!meta || !Number.isInteger(meta.day) || meta.day < 1) fail("meta.day");
  if (!TIMES.includes(meta.timeOfDay)) fail("meta.timeOfDay");
  if (!Number.isInteger(meta.turnCount) || meta.turnCount < 1) fail("meta.turnCount");
  if (!player || typeof player.name !== "string" || typeof player.origin !== "string") fail("player");
  if (!Array.isArray(player.traits) || !Number.isInteger(player.strikes) || player.strikes < 0 || !Number.isInteger(player.maxHealth) || player.maxHealth < 100) fail("player extras");
  if (!["creating", "playing", "lost"].includes(meta.status) || !Number.isInteger(meta.coldStreak) || meta.coldStreak < 0 || !Number.isInteger(meta.totalEarned) || !Number.isInteger(meta.encounters)) fail("meta extras");
  for (const k of Object.keys(STAT_LIMITS)) {
    const v = player.stats && player.stats[k];
    if (!Number.isFinite(v) || v < STAT_LIMITS[k][0] || v > (k === "health" ? player.maxHealth : STAT_LIMITS[k][1])) fail(`stat ${k}`);
  }
  if (!Array.isArray(player.inventory) || !player.inventory.every((i) => i && typeof i.id === "string" && typeof i.name === "string" && ["consumable", "gear", "material"].includes(i.type))) fail("inventory");
  if (!world || !Array.isArray(world.districts) || !world.districts.includes(world.currentDistrict)) fail("world");
  if (!world.activeFlags || typeof world.activeFlags !== "object") fail("activeFlags");
  if (!WEATHER[world.weather] || !world.activeOperations || typeof world.activeOperations !== "object") fail("world extras");
  if (world.celebration && typeof world.celebration.title !== "string") fail("celebration");
  const fx = world.factions;
  if (!fx || !FACTION_IDS.every((k) => fx[k] && Number.isInteger(fx[k].rep) && Math.abs(fx[k].rep) <= 50)) fail("factions");
  if (!world.districtHeat || !world.districts.every((d) => Number.isFinite(world.districtHeat[d]) && world.districtHeat[d] >= 0 && world.districtHeat[d] <= 100)) fail("districtHeat");
  if (!s.phone || !Array.isArray(s.phone.messages) || s.phone.messages.length > 12) fail("phone");
  if (s.activeContract !== null && !(s.activeContract && typeof s.activeContract.id === "string")) fail("activeContract");
  if (!Array.isArray(chronicle) || !chronicle.every((c) => c && typeof c.event === "string")) fail("chronicle");
  if (!Array.isArray(s.narrativeSeeds) || s.narrativeSeeds.length > 6 || !s.narrativeSeeds.every((x) => typeof x === "string")) fail("narrativeSeeds");
  return true;
}

/* ============ ITEMS & WEATHER ============ */
const WEATHERS = ["Clear", "Rain", "Patrol Surge", "Block Party"];
const WEATHER = {
  Clear: { cls: "text-zinc-300", tip: "No special conditions.", text: "", log: "The morning comes in plain and gray." },
  Rain: { cls: "text-sky-300", tip: "Bust chance halved. Travel costs +5 Energy.", text: "Rain slicks the pavement. Fewer eyes on the block, but every walk costs more.", log: "Rain moved in overnight. The block went quiet." },
  "Patrol Surge": { cls: "text-rose-400", tip: "All Heat gains +50%. Lay Low drops double Heat.", text: "Patrol cars crawl the grid. Every move draws extra heat.", log: "A patrol surge hit the neighborhood at dawn." },
  "Block Party": { cls: "text-amber-300", tip: "Bodega and street hustles pay +25%. Theft risk is higher.", text: "Speakers blare from the stoops. Pockets are loose, and so are fingers.", log: "A hot weekend turned the block into a party." }
};
const ITEM_DEFS = {
  lockpick: { name: "Heavy Duty Lockpick", type: "gear", effectDescription: "Passive: opens trunks and ATM housings." },
  decryptor: { name: "Hardware Decryptor", type: "gear", effectDescription: "Passive: unlocks Cyber Skim and ATM skimming. Fence payouts +20%." },
  stolen_electronics: { name: "Stolen Electronics", type: "material", effectDescription: "Fence it for cash or use it at the workbench." },
  scrap_metal: { name: "Scrap Metal", type: "material", effectDescription: "Raw parts for the workbench." },
  card_dumps: { name: "Raw Bank Card Dumps", type: "material", effectDescription: "Cash out at the Safehouse or Chop Shop." },
  energy_shot: { name: "Energy Shot", type: "consumable", effectDescription: "Use: +40 Energy.",
    use: () => ({ delta: { energy: 40 }, seeds: [], logs: [["narrative", "Cracked an energy shot and drank it standing up."], ["gain", "+40 Energy."]] }) },
  bandage: { name: "Quick-Clot Bandage", type: "consumable", effectDescription: "Use: +35 Health.",
    use: () => ({ delta: { health: 35 }, seeds: ["patched up wounds with a quick-clot bandage"], logs: [["narrative", "Packed the wound and wrapped it tight."], ["gain", "+35 Health."]] }) },
  windbreaker: { name: "Reversible Windbreaker", type: "consumable", effectDescription: "Use: -25 Heat.",
    use: () => ({ delta: { heat: -25 }, seeds: ["flipped a reversible windbreaker inside out to shake attention"], flags: { wore_disguise: true }, logs: [["narrative", "Flipped the windbreaker inside out and kept walking."], ["gain", "Heat -25."]] }) }
};
const mkItem = (id) => { const d = ITEM_DEFS[id]; if (!d) throw new RangeError(`Unknown item "${id}"`); return { id, name: d.name, type: d.type, effectDescription: d.effectDescription }; };
const NM = (id) => ITEM_DEFS[id].name;

/** Upgrades older saves (v6 and earlier fields) to the current schema. Pure: returns a new object. */
function migrateState(raw) {
  const st = clone(raw);
  if (!st || typeof st !== "object") return st;
  if (st.meta) { if (st.meta.status === "won") st.meta.status = "playing"; if (st.meta.coldStreak === undefined) st.meta.coldStreak = 0; }
  if (st.world && st.world.celebration === undefined) st.world.celebration = null;
  return st;
}
/** Pure reducer: (state, action) -> new state. Never mutates its input. */
function reducer(state, action) {
  if (!action || typeof action.type !== "string") throw new TypeError("Action requires a string type");
  switch (action.type) {
    case "BATCH":
      return action.actions.reduce(reducer, state);
    case "MODIFY_STATS": {
      const stats = { ...state.player.stats };
      for (const [k, d] of Object.entries(action.delta || {})) stats[k] = clampStat(k, stats[k] + d, state.player.maxHealth);
      return { ...state, player: { ...state.player, stats } };
    }
    case "ADVANCE_TIME": {
      const i = TIMES.indexOf(state.meta.timeOfDay);
      const rollover = i === TIMES.length - 1;
      return { ...state, meta: { ...state.meta, timeOfDay: TIMES[(i + 1) % TIMES.length], day: state.meta.day + (rollover ? 1 : 0), turnCount: state.meta.turnCount + 1 } };
    }
    case "SET_DISTRICT":
      if (!state.world.districts.includes(action.district)) throw new RangeError(`Unknown district "${action.district}"`);
      return { ...state, world: { ...state.world, currentDistrict: action.district } };
    case "ADD_ITEM":
      return { ...state, player: { ...state.player, inventory: [...state.player.inventory, mkItem(action.item)] } };
    case "REMOVE_ITEM": {
      const idx = state.player.inventory.findIndex((i) => i.id === action.item);
      if (idx === -1) throw new RangeError(`Item "${action.item}" not in inventory`);
      const inventory = state.player.inventory.filter((_, n) => n !== idx);
      return { ...state, player: { ...state.player, inventory } };
    }
    case "SET_FLAG":
      return { ...state, world: { ...state.world, activeFlags: { ...state.world.activeFlags, [action.flag]: action.value } } };
    case "LOG": {
      const entry = { day: state.meta.day, time: state.meta.timeOfDay, event: String(action.event), kind: action.kind || "narrative" };
      return { ...state, chronicle: [...state.chronicle, entry].slice(-MAX_CHRONICLE) };
    }
    case "START_RUN": {
      const base = clone(defaultState);
      return { ...base, meta: { ...base.meta, status: "playing" }, player: clone(action.player), chronicle: [{ day: 1, time: "Morning", event: String(action.intro), kind: "narrative" }] };
    }
    case "END_RUN":
      return { ...state, meta: { ...state.meta, status: "lost", ending: clone(action.ending) } };
    case "ADD_STRIKE":
      return { ...state, player: { ...state.player, strikes: state.player.strikes + 1 } };
    case "TALLY":
      return { ...state, meta: { ...state.meta, totalEarned: state.meta.totalEarned + action.earned, encounters: state.meta.encounters + action.encounters } };
    case "SET_WEATHER":
      if (!WEATHER[action.weather]) throw new RangeError(`Unknown weather "${action.weather}"`);
      return { ...state, world: { ...state.world, weather: action.weather } };
    case "SET_OPERATION": {
      const operations = { ...state.world.activeOperations };
      if (action.op) operations[action.id] = clone(action.op); else delete operations[action.id];
      return { ...state, world: { ...state.world, activeOperations: operations } };
    }
    case "SHIFT_REP": {
      const factions = { ...state.world.factions };
      for (const [k, d] of Object.entries(action.deltas || {})) {
        if (!factions[k]) throw new RangeError(`Unknown faction "${k}"`);
        const locked = (k === "westside" || k === "council") && state.world.activeFlags.milestone_kingpin === true;
        factions[k] = { ...factions[k], rep: locked ? 50 : Math.max(-50, Math.min(50, Math.round(factions[k].rep + d))) };
      }
      return { ...state, world: { ...state.world, factions } };
    }
    case "DHEAT": {
      if (!(action.district in state.world.districtHeat)) throw new RangeError(`Unknown district "${action.district}"`);
      const dh = { ...state.world.districtHeat }; dh[action.district] = Math.max(0, Math.min(100, Math.round(dh[action.district] + action.delta)));
      return { ...state, world: { ...state.world, districtHeat: dh } };
    }
    case "DHEAT_BLEED": {
      const dh = {}; for (const [k, v] of Object.entries(state.world.districtHeat)) dh[k] = Math.max(0, v - action.amount);
      return { ...state, world: { ...state.world, districtHeat: dh } };
    }
    case "SET_CONTRACT":
      return { ...state, activeContract: action.contract ? clone(action.contract) : null };
    case "PHONE_MSG":
      return { ...state, phone: { messages: [...state.phone.messages, { from: String(action.from), text: String(action.text).slice(0, 160), day: state.meta.day }].slice(-12) } };
    case "CLEAR_STRIKE":
      return { ...state, player: { ...state.player, strikes: Math.max(0, state.player.strikes - 1) } };
    case "ADD_SEEDS":
      return { ...state, narrativeSeeds: [...state.narrativeSeeds, ...action.seeds.map((x) => String(x).slice(0, 160))].slice(-6) };
    case "LOAD": {
      const next = migrateState(action.state);
      validateState(next);
      return clone(next);
    }
    case "ADD_DISTRICT": {
      if (state.world.districts.includes(action.district)) return state;
      return { ...state, world: { ...state.world, districts: [...state.world.districts, String(action.district)], districtHeat: { ...state.world.districtHeat, [action.district]: 0 } } };
    }
    case "SET_META": {
      if (action.field !== "coldStreak" || !Number.isInteger(action.value) || action.value < 0) throw new RangeError("Invalid meta field");
      return { ...state, meta: { ...state.meta, coldStreak: action.value } };
    }
    case "SET_CELEBRATION":
      return { ...state, world: { ...state.world, celebration: action.celebration ? clone(action.celebration) : null } };
    case "RESET":
      return clone(defaultState);
    default:
      throw new TypeError(`Unknown action type "${action.type}"`);
  }
}

/** Centralized store. Reads return defensive clones; writes are atomic. */
class GameState {
  #state; #listeners = new Set();
  constructor(initial = defaultState) { validateState(initial); this.#state = deepFreeze(clone(initial)); }
  getState() { return clone(this.#state); }
  subscribe(fn) {
    if (typeof fn !== "function") throw new TypeError("Listener must be a function");
    this.#listeners.add(fn); return () => this.#listeners.delete(fn);
  }
  /** Applies an action; on any error the previous state is retained and the error rethrown. */
  dispatch(action) {
    const prev = this.#state;
    const next = deepFreeze(clone(reducer(prev, action)));
    validateState(next);
    this.#state = next;
    for (const fn of this.#listeners) {
      try { fn(clone(next), clone(prev), action); } catch (e) { console.error("Listener failed:", e); }
    }
  }
  serialize() { return JSON.stringify(this.#state); }
}

/* ============ SAVE PORTABILITY ENCODING ============ */
function encodeB64(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); }
function decodeB64(b64) { const bin = atob(b64); const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0)); return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }

/* ============ SOUND ENGINE (zero assets, Web Audio only) ============ */
const AUDIO_KEY = "street-stories-audio";
/** Haptic feedback via the HTML5 Vibration API. Silently no-ops where unsupported. */
const Haptics = {
  vibrate(pattern) {
    try { if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") navigator.vibrate(pattern); } catch (e) { /* unsupported or blocked: ignore */ }
  },
  light() { this.vibrate([30]); },
  success() { this.vibrate([40, 60, 40]); },
  danger() { this.vibrate([100, 50, 100]); }
};
class SoundEngine {
  #ctx = null; #muted = true;
  constructor() {
    try { const raw = localStorage.getItem(AUDIO_KEY); this.#muted = raw === null ? true : JSON.parse(raw).muted !== false; } catch (e) { this.#muted = true; }
    if (typeof document !== "undefined") for (const ev of ["pointerdown", "keydown", "touchstart"]) document.addEventListener(ev, () => this.#unlock(), { passive: true, capture: true });
  }
  get muted() { return this.#muted; }
  setMuted(v) {
    this.#muted = v !== false;
    try { localStorage.setItem(AUDIO_KEY, JSON.stringify({ muted: this.#muted })); } catch (e) { /* storage unavailable: setting lasts this session */ }
    if (!this.#muted) this.#unlock();
  }
  reset() { this.#muted = true; }
  #unlock() {
    if (this.#muted) return;
    try {
      if (!this.#ctx) { const AC = typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext); if (!AC) return; this.#ctx = new AC(); }
      if (this.#ctx.state === "suspended") this.#ctx.resume().catch(() => {});
    } catch (e) { this.#ctx = null; }
  }
  #play(fn) {
    if (this.#muted || !this.#ctx || this.#ctx.state !== "running") return;
    try { fn(this.#ctx, this.#ctx.currentTime); } catch (e) { /* audio is optional */ }
  }
  #osc(c, type, t, f0, f1, dur, vol, dest) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  playClick() { this.#play((c, t) => this.#osc(c, "triangle", t, 800, 500, 0.04, 0.12)); }
  playCash() { this.#play((c, t) => { this.#osc(c, "sine", t, 987, null, 0.22, 0.18); this.#osc(c, "sine", t + 0.08, 1318, null, 0.3, 0.16); }); }
  playDanger() {
    this.#play((c, t) => {
      const shaper = c.createWaveShaper(), n = 256, curve = new Float32Array(n);
      for (let i = 0; i < n; i++) curve[i] = Math.tanh(3 * ((i * 2) / n - 1));
      shaper.curve = curve; const boost = c.createGain(); boost.gain.value = 1.6; shaper.connect(boost).connect(c.destination);
      this.#osc(c, "sawtooth", t, 110, 40, 0.55, 0.22, shaper); this.#osc(c, "sine", t, 110, 40, 0.55, 0.18, shaper);
    });
  }
  playSuccess() { this.#play((c, t) => { for (const f of [261.63, 329.63, 392]) this.#osc(c, "triangle", t, f, null, 0.8, 0.09); }); }
  playPager() { this.#play((c, t) => { this.#osc(c, "square", t, 1760, null, 0.09, 0.07); this.#osc(c, "square", t + 0.14, 1760, null, 0.09, 0.07); }); }
}

/* ============ CONTROLLER: DISTRICT REGISTRY ============ */
const SAVE_KEY = "street-stories-save-v7";
const LEGACY_SAVE_KEY = "street-stories-save-v6";
const OFFICE = "Downtown Office";
const MILESTONE_IDS = ["mogul", "kingpin", "ghost"];
const hasMs = (s, k) => flag(s, `milestone_${k}`, false) === true;
const anyMs = (s) => MILESTONE_IDS.some((k) => hasMs(s, k));
const strikeLimit = (s) => (flag(s, "corrupt_lawyer", false) ? 5 : 3);
const coldDays = (s) => s.meta.coldStreak || 0;

const SAFE = "Market St Safehouse", BODEGA = "Corner Bodega", SHOP = "The Chop Shop", STRIP = "Downtown Strip";
const ITEM = { LOCK: "lockpick", LOOT: "stolen_electronics" };
const R = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const has = (s, i) => s.player.inventory.some((x) => x.id === i);
const flag = (s, k, d) => (k in s.world.activeFlags ? s.world.activeFlags[k] : d);

function localWire(s, rng) {
  const y = s.chronicle.filter((c) => c.day === s.meta.day - 1);
  const cat = s.player.stats.heat >= 60 ? "heat" : y.some((c) => c.kind === "loss") ? "loss" : y.some((c) => c.kind === "gain") ? "gain" : "quiet";
  return WIRE[cat][Math.floor(rng() * WIRE[cat].length)].replace(/\{d\}/g, s.world.currentDistrict);
}

  static validate(c) {
    let url; try { url = new URL(String(c.endpointUrl).trim()); if (!/^https?:$/.test(url.protocol)) throw new Error("scheme"); } catch (_) { throw new Error("Endpoint must be a valid http(s) URL."); }
    const model = clean(c.modelName, 80); if (!model) throw new Error("Model name is required.");

  }

      .map((c) => `- Day ${Number(c.day) || 0} ${clean(c.time, 10)}: ${clean(c.event, 160)}`).join("\n");
    const facts = [`Alias: ${clean(p.name, 20)}`, `Origin: ${clean(p.origin, 30)}`, `Day ${s.meta.day}, ${s.meta.timeOfDay}`, `District: ${clean(s.world.currentDistrict, 40)}`, `Street conditions: ${clean(s.world.weather, 20)}`,
      `Police attention: ${st.heat >= 75 ? "extreme" : st.heat >= 40 ? "high" : st.heat >= 20 ? "moderate" : "low"}`, `Strikes: ${p.strikes} of 3`,
      `Reputation: ${st.streetCred >= 60 ? "feared" : st.streetCred >= 25 ? "known" : "unknown"}`, f.ownsChopShop ? "Owns the Chop Shop" : "", f.hotLead ? "Has a hot lead" : "", ...factionFacts(s)].filter(Boolean).join("\n");
    const seeds = (s.narrativeSeeds || []).map((x) => "- " + clean(x, 160)).join("\n"),
      flags = Object.entries(f).filter(([k, v]) => v === true && /^[a-z0-9_]+$/i.test(k)).map(([k]) => k.replace(/_/g, " ")).join(", ");
    const task = kind === "wire" ? "Write the Morning Wire: a headline-style dispatch for this district about last night, using only the confirmed events, story flags and ledger above."
      : `Write the Final Edition: a closing newspaper blurb about how this run ended (${clean(s.meta.ending && s.meta.ending.title, 40)}).`;
    return { system: SYSTEM_PROMPT, user: `<data>\n${facts}\nSTORY FLAGS: ${flags || "none"}\nCONFIRMED EVENTS (hard facts):\n${seeds || "- none"}\nRecent ledger:\n${recent}\n</data>\n${task}` };
  }
  static sanitize(raw) {
    if (typeof raw !== "string") return "";
    let t = raw.replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/<think>[\s\S]*$/i, "").replace(/<[^>]*>/g, "").replace(/[*_#`>"\u201c\u201d]/g, "").replace(/\s+/g, " ").trim();
    const m = t.match(/[^.!?]+[.!?]+/g); if (m) t = m.slice(0, 2).map((x) => x.trim()).join(" ");
    t = t.slice(0, 300); return t.length >= 20 ? t : "";
  }
  async generate(kind, s) {
    const c = this.config, { system, user } = this.buildPrompt(kind, s), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), AI_TIMEOUT_MS);
    try {
      const body = c.apiFormat === "openai"
        ? { model: c.modelName, stream: false, temperature: 0.7, max_tokens: 80, messages: [{ role: "system", content: system }, { role: "user", content: user }] }
        : { model: c.modelName, stream: false, think: false, system, prompt: user, options: { temperature: 0.7, num_predict: 80 } };
      const res = await fetch(c.endpointUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const text = NarrativeBridge.sanitize(c.apiFormat === "openai" ? data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content : data && data.response);
      if (!text) throw new Error("Empty or unusable model output");
      return text;
    } finally { clearTimeout(timer); }
  }
  async ping(c) {
    const cfg = NarrativeBridge.validate(c), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 4000), t0 = Date.now();
    try {
      const res = await fetch(new URL(cfg.apiFormat === "openai" ? "/v1/models" : "/api/tags", cfg.endpointUrl).href, { signal: ctl.signal });
      return { ok: res.ok, ms: Date.now() - t0, detail: res.ok ? "" : `HTTP ${res.status}` };
    } catch (e) { return { ok: false, ms: 0, detail: e.name === "AbortError" ? "Timed out" : "Unreachable (network, CORS or blocked by the page)" }; }
    finally { clearTimeout(timer); }
  }
}

/* ============ SHOPS, CRAFTING, MODIFIERS ============ */
const SHOP_STOCK = { [SAFE]: ["windbreaker"], [BODEGA]: ["energy_shot", "bandage", "windbreaker"], [SHOP]: ["decryptor"] };
const PRICE = { energy_shot: 20, bandage: 35, windbreaker: 75, decryptor: 300 };
const RECIPES = { lockpick: { needs: { scrap_metal: 1, stolen_electronics: 1 } }, decryptor: { needs: { scrap_metal: 2, stolen_electronics: 2 }, trait: "systemCracker" } };
const count = (s, id) => s.player.inventory.filter((i) => i.id === id).length;
const fenceMul = (s) => (T(s, "systemCracker") ? 1.25 : 1) * (has(s, "decryptor") ? 1.2 : 1);
const travelCost = (s) => 10 + (s.world.weather === "Rain" ? 5 : 0);

class GameController {
  constructor(store, rng = Math.random, bridge = null) { this.store = store; this.rng = rng; this.bridge = bridge || new NarrativeBridge(); this.sound = new SoundEngine(); this.wire = null; this.finalEd = null; this.wireSeq = 0; this.onAsync = () => {}; this.notice = null; this.outcome = null; this.listeners = new Set(); }
  onNotice(fn) { this.listeners.add(fn); }
  #notify(m) { this.notice = m; this.listeners.forEach((f) => f(m)); }
  #rule(c, m) { if (!c) { const e = new Error(m); e.userMessage = m; throw e; } }
  #run(fn, free = false) { try { this.#notify(null); if (!free) this.#rule(this.store.getState().meta.status === "playing", "The run is over."); fn(); } catch (e) { console.error(e); this.outcome = null; this.#notify(e.userMessage || "Something went wrong. Try again."); } }

  cards(s) { return this.cardsFor(s).filter((c) => !(c.hidden && c.hidden(s))).map((card) => ({ card, reason: this.status(s, card) })); }
  status(s, card) {
    const p = s.player.stats;
    if (card.lock) { const r = card.lock(s); if (r) return r; }
    if (card.energy > p.energy) return p.energy === 0 ? "Exhausted: rest here, or limp back to the Safehouse" : `Needs ${card.energy} Energy`;
    if (costOf(s, card) > p.cash) return `Needs $${costOf(s, card)}`;
    return null;
  }

  perform(id) {
    this.#run(() => {
      const s = this.store.getState(), card = this.cardsFor(s).find((c) => c.id === id);
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(card && !card.panel, "That action is not available here.");
      const why = this.status(s, card); this.#rule(!why, why);
      const out = card.run(s, this.rng), d = { energy: -card.energy, cash: -costOf(s, card) };
      for (const [k, v] of Object.entries(out.delta)) d[k] = (d[k] || 0) + v;
      const ops = [{ type: "MODIFY_STATS", delta: d }, ...(out.ops || []), ...this.#repOps(card.rep, out.rep), ...(card.hustle ? [{ type: "DHEAT", district: s.world.currentDistrict, delta: 10 }] : []), ...seedOps([...(card.narrative_seeds || []), ...(out.narrative_seeds || [])], { ...(card.flags || {}), ...(out.flags || {}) }), ...out.logs.map(([kind, event]) => ({ type: "LOG", kind, event }))];
      if (out.ending) ops.push({ type: "END_RUN", ending: out.ending });
      if (out.advance) ops.push({ type: "ADVANCE_TIME" });
      this.#commit(ops, { earned: Math.max(0, out.delta.cash || 0), chance: id === "avenue" || id === "fence" ? 0.35 : 0 });
    });
  }

  travel(district) {
    this.#run(() => {
      const s = this.store.getState();
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(district !== s.world.currentDistrict, "You are already here.");
      const cost = travelCost(s);
      // Soft-lock fail-safe: a player who cannot afford travel can always stagger back to the safehouse.
      if (s.player.stats.energy < cost && district === SAFE) {
        this.#commit([{ type: "MODIFY_STATS", delta: { health: -5 } }, { type: "SET_DISTRICT", district: SAFE },
          { type: "LOG", kind: "loss", event: "Exhausted, you staggered through alleyways back to the safehouse. -5 Health." }, { type: "ADVANCE_TIME" }]);
        return;
      }
      this.#rule(s.player.stats.energy >= cost, s.player.stats.energy === 0 ? "Too exhausted to travel. Rest here, or limp back to the Safehouse." : `Travel costs ${cost} Energy.`);
      this.#commit([{ type: "MODIFY_STATS", delta: { energy: -cost } }, { type: "SET_DISTRICT", district },
        { type: "LOG", kind: "narrative", event: `Moved out to ${district}. -${cost} Energy.` }, { type: "ADVANCE_TIME" }],
        { chance: 0.2 + s.player.stats.heat * 0.005 + (dheat(s, district) >= 50 ? 0.15 : 0), ambush: repOf(s, FACTION_OF[district]) <= -25 ? 0.25 : 0 });
    });
  }

  stashCash(amount) {
    this.#run(() => {
      const s = this.store.getState(), held = flag(s, "stashCash", 0);
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(s.world.currentDistrict === SAFE, "The stash is at the safehouse.");
      this.#rule(Number.isInteger(amount) && amount !== 0, "Invalid amount.");
      this.#rule(amount > 0 ? s.player.stats.cash >= amount : held >= -amount, amount > 0 ? "Not enough cash on you." : "Not enough in the stash.");
      this.#commit([{ type: "MODIFY_STATS", delta: { cash: -amount } }, { type: "SET_FLAG", flag: "stashCash", value: held + amount },
        { type: "LOG", kind: "narrative", event: amount > 0 ? `Stashed $${amount} behind the loose panel.` : `Took $${-amount} out of the stash.` }]);
    });
  }

  stashItem(index, toStash) {
    this.#run(() => {
      const s = this.store.getState(), held = flag(s, "stashItems", []);
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(s.world.currentDistrict === SAFE, "The stash is at the safehouse.");
      const item = toStash ? (s.player.inventory[index] || {}).id : held[index];
      this.#rule(item, "Nothing there.");
      const next = toStash ? [...held, item] : held.filter((_, i) => i !== index);
      this.#commit([toStash ? { type: "REMOVE_ITEM", item } : { type: "ADD_ITEM", item }, { type: "SET_FLAG", flag: "stashItems", value: next },
        { type: "LOG", kind: "narrative", event: toStash ? `Stashed ${NM(item)}.` : `Retrieved ${NM(item)}.` }]);
    });
  }

  #morningWire(s) {
    const id = ++this.wireSeq, local = localWire(s, this.rng), on = this.bridge.config.aiEnabled;
    this.#setWire(id, s, local, "Local wire", !on);
    if (!on) return;
    this.bridge.generate("wire", s).then((t) => this.#setWire(id, s, t, "AI wire", true),
      (e) => { console.warn("AI wire failed, keeping local headline:", e); this.#logWire(id, s, local); });
  }
  #setWire(id, s, text, source, log) {
    if (id !== this.wireSeq) return;
    this.wire = { id, day: s.meta.day, text, source, pending: false }; this.onAsync();
    if (log) this.#logWire(id, s, text);
  }
  #logWire(id, s, text) {
    const now = this.store.getState();
    if (id !== this.wireSeq || now.meta.status !== "playing" || now.meta.day !== s.meta.day) return;
    try { this.store.dispatch({ type: "LOG", kind: "narrative", event: `Morning Wire: ${text}` }); this.save(); } catch (e) { console.warn(e); }
  }
  #finalEdition(s) {
    if (!this.bridge.config.aiEnabled) return;
    const tok = {}; this.finalEd = { tok, pending: true, text: "" }; this.onAsync();
    this.bridge.generate("final", s).then((t) => { if (this.finalEd && this.finalEd.tok === tok) { this.finalEd = { tok, pending: false, text: t }; this.onAsync(); } },
      (e) => { console.warn("Final edition failed:", e); if (this.finalEd && this.finalEd.tok === tok) { this.finalEd = null; this.onAsync(); } });
  }

  /** Applies trait and weather modifiers to stat deltas before they are committed. */
  #hardened(s, ops) {
    const hard = T(s, "hardened"), surge = s.world.weather === "Patrol Surge", mogul = hasMs(s, "mogul");
    if (!hard && !surge && !mogul) return [...ops];
    return ops.flatMap((o) => {
      if (o.type !== "MODIFY_STATS") return [o];
      const d = { ...o.delta }, extra = [];
      if (hard && d.health < 0) { const cut = Math.round(-d.health * 0.25); d.health += cut; extra.push({ type: "LOG", kind: "gain", event: `Hardened: shrugged off ${cut} damage.` }); }
      if (surge && d.heat > 0) { const add = Math.round(d.heat * 0.5); d.heat += add; extra.push({ type: "LOG", kind: "warn", event: `Patrol surge: +${add} extra Heat.` }); }
      if (mogul && d.heat > 0) { const cut = Math.round(d.heat * 0.2); d.heat -= cut; extra.push({ type: "LOG", kind: "gain", event: `Corporate cover: -${cut} heat gain.` }); }
      return [{ ...o, delta: d }, ...extra];
    });
  }

  useItem(id) {
    this.#run(() => {
      const s = this.store.getState(), def = ITEM_DEFS[id];
      this.#rule(def && def.type === "consumable" && def.use, "That item can't be used.");
      this.#rule(has(s, id), "You don't have that item.");
      const out = def.use(s);
      this.#commit([{ type: "REMOVE_ITEM", item: id }, { type: "MODIFY_STATS", delta: out.delta || {} }, ...seedOps(out.seeds, out.flags), ...out.logs.map(([kind, event]) => ({ type: "LOG", kind, event }))]);
    });
  }
  buy(id) {
    this.#run(() => {
      const s = this.store.getState(), d = s.world.currentDistrict;
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule((SHOP_STOCK[d] || []).includes(id), "Not sold here.");
      this.#rule(!(ITEM_DEFS[id].type === "gear" && has(s, id)), "Already owned.");
      this.#rule(s.player.stats.cash >= PRICE[id], `Needs $${PRICE[id]}.`);
      this.#commit([{ type: "MODIFY_STATS", delta: { cash: -PRICE[id] } }, { type: "ADD_ITEM", item: id }, ...seedOps([`bought a ${NM(id)} at ${d}`], {}),
        { type: "LOG", kind: "narrative", event: `Bought a ${NM(id)} for $${PRICE[id]}.` }]);
    });
  }
  craft(id) {
    this.#run(() => {
      const s = this.store.getState(), r = RECIPES[id];
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(r && s.world.currentDistrict === SAFE && flag(s, "workbench", false), "Crafting needs the safehouse workbench.");
      this.#rule(!r.trait || T(s, r.trait), "Only a Tech Dropout can build that.");
      this.#rule(!has(s, id), "You already have one.");
      for (const [k, n] of Object.entries(r.needs)) this.#rule(count(s, k) >= n, `Needs ${n} ${NM(k)}.`);
      const ops = Object.entries(r.needs).flatMap(([k, n]) => Array.from({ length: n }, () => ({ type: "REMOVE_ITEM", item: k })));
      this.#commit([...ops, { type: "ADD_ITEM", item: id }, ...seedOps([`built a ${NM(id)} at the safehouse workbench`], { crafted_gear: true }),
        { type: "LOG", kind: "gain", event: `Crafted a ${NM(id)} from scrap and stolen parts.` }]);
    });
  }
  betNumbers(amount) {
    this.#run(() => {
      const s = this.store.getState();
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(s.world.currentDistrict === BODEGA, "The numbers game runs out of the bodega.");
      this.#rule([10, 25, 50].includes(amount), "Bet $10, $25 or $50.");
      this.#rule(flag(s, "racketBet", 0) === 0, "You already have today's number.");
      this.#rule(s.player.stats.cash >= amount, `Needs $${amount}.`);
      this.#commit([{ type: "MODIFY_STATS", delta: { cash: -amount } }, { type: "SET_FLAG", flag: "racketBet", value: amount }, ...seedOps([`played the backroom numbers for $${amount}`], {}),
        { type: "LOG", kind: "narrative", event: `Put $${amount} on today's number. It pays when the day rolls over.` }]);
    });
  }
  /** Day-rollover effects, committed in the same batch as the action that ended the day. */
  #rollover(s) {
    const w = WEATHERS[Math.floor(this.rng() * WEATHERS.length)], bet = flag(s, "racketBet", 0), op = s.world.activeOperations.atm_skim;
    const ops = [{ type: "DHEAT_BLEED", amount: 15 }, { type: "SET_WEATHER", weather: w }, { type: "LOG", kind: w === "Patrol Surge" ? "warn" : "narrative", event: WEATHER[w].log }];
    if (bet > 0) {
      ops.push({ type: "SET_FLAG", flag: "racketBet", value: 0 });
      if (this.rng() < 0.2) ops.push({ type: "MODIFY_STATS", delta: { cash: bet * 4 } }, { type: "TALLY", earned: bet * 4, encounters: 0 }, { type: "SET_FLAG", flag: "hit_the_number", value: true },
        { type: "ADD_SEEDS", seeds: [`hit the daily number for $${bet * 4}`] }, { type: "LOG", kind: "gain", event: `Your number hit. +$${bet * 4}.` });
      else ops.push({ type: "ADD_SEEDS", seeds: [`lost $${bet} on the daily number`] }, { type: "LOG", kind: "loss", event: `Your number missed. The $${bet} is gone.` });
    }
    if (op && op.stage === "planted" && s.meta.day > op.collectDay + 1)
      ops.push({ type: "SET_OPERATION", id: "atm_skim", op: null }, { type: "SET_FLAG", flag: "atm_skimmer_planted", value: false }, { type: "ADD_SEEDS", seeds: ["a planted ATM skimmer was found and pulled by bank security"] },
        { type: "LOG", kind: "warn", event: "Bank security pulled your skimmer. The operation is dead." });
    const day = s.meta.day, cash = s.player.stats.cash;
    if (day % 7 === 0) {
      const rent = 250 + 50 * (day / 7), paid = Math.min(cash, rent);
      ops.push({ type: "MODIFY_STATS", delta: { cash: -paid } },
        { type: "LOG", kind: paid < rent ? "warn" : "loss", event: paid < rent ? `Weekly rent is $${rent}. You had $${paid}. Bailiffs took it and flagged your name. Heat +10.` : `Weekly rent of $${rent} paid.` });
      if (paid < rent) ops.push({ type: "MODIFY_STATS", delta: { heat: 10 } }, { type: "ADD_SEEDS", seeds: ["missed weekly rent and bailiffs cleaned out the safehouse"] });
    }
    if (hasMs(s, "mogul")) {
      const rev = R(this.rng, 350, 600);
      ops.push({ type: "MODIFY_STATS", delta: { cash: rev } }, { type: "TALLY", earned: rev, encounters: 0 }, { type: "LOG", kind: "gain", event: `Clean storefront revenue: +$${rev}.` });
    }
    ops.push({ type: "SET_META", field: "coldStreak", value: s.player.stats.heat === 0 ? coldDays(s) + 1 : 0 });
    if (total(s) >= 10000 && !flag(s, "commercial_lease", false)) {
      if (this.rng() < 0.3 && cash > 0) { const lost = Math.min(cash, 500); ops.push({ type: "MODIFY_STATS", delta: { cash: -lost } }, { type: "LOG", kind: "loss", event: `A Downtown collector squeezed you for $${lost}. Big cash draws big hands.` }, { type: "ADD_SEEDS", seeds: [`a Downtown collector squeezed a fat stash for $${lost}`] }); }
      if (this.rng() < 0.2) ops.push({ type: "MODIFY_STATS", delta: { heat: 10 } }, { type: "SET_FLAG", flag: "federal_flag", value: true }, { type: "LOG", kind: "warn", event: "A federal tax flag landed on your name. Heat +10." }, { type: "ADD_SEEDS", seeds: ["a federal tax flag landed on the player after storing a large cash pile"] });
    }
    if (op && op.stage === "planted" && hasMs(s, "ghost") && day >= op.collectDay && day <= op.collectDay + 1)
      ops.push({ type: "ADD_ITEM", item: "card_dumps" }, { type: "SET_OPERATION", id: "atm_skim", op: null }, { type: "LOG", kind: "gain", event: "Your scanner-fed skimmer harvested itself overnight. Card dumps in the bag." }, { type: "ADD_SEEDS", seeds: ["a skimmer on a Downtown ATM harvested itself overnight"] });
    return ops;
  }

  cardsFor(s) {
    const d = s.world.currentDistrict, c = s.activeContract, base = DISTRICTS[d].cards;
    const ms = MILESTONE_IDS.filter((k) => !hasMs(s, k) && MILESTONES[k].district === d).map((k) => milestoneCard(k));
    const extra = c && c.status === "accepted" && c.district === d && CONTRACTS.some((x) => x.id === c.id) ? [contractCard(c)] : [];
    return [...base, ...ms, ...extra];
  }
  #repOps(...maps) {
    const m = {};
    for (const x of maps) for (const [k, v] of Object.entries(x || {})) m[k] = (m[k] || 0) + v;
    return Object.keys(m).length ? [{ type: "SHIFT_REP", deltas: m }] : [];
  }
  acceptContract() {
    this.#run(() => {
      const s = this.store.getState(), c = s.activeContract;
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(c && c.status === "offered", "There is no contract to accept.");
      const who = CONTACTS[c.giver].name;
      this.#commit([{ type: "SET_CONTRACT", contract: { ...c, status: "accepted" } }, { type: "PHONE_MSG", from: c.giver, text: `Good. Finish it at ${c.district} by Day ${c.expiresDay}.` },
        ...seedOps([`took ${who}'s ${c.title} contract`], { [`contract_${c.id}_taken`]: true }), { type: "LOG", kind: "narrative", event: `Accepted ${who}'s job: ${c.title}.` }]);
    });
  }
  declineContract() {
    this.#run(() => {
      const s = this.store.getState(), c = s.activeContract;
      this.#rule(c && c.status === "offered", "There is no contract to decline.");
      this.#commit([{ type: "SET_CONTRACT", contract: null }, { type: "PHONE_MSG", from: c.giver, text: "Your loss." }, ...seedOps([`turned down ${CONTACTS[c.giver].name}'s ${c.title} job`], {}),
        { type: "LOG", kind: "narrative", event: `Turned down ${CONTACTS[c.giver].name}'s job.` }]);
    });
  }
  callSal() {
    this.#run(() => {
      const s = this.store.getState();
      this.#rule(!this.current(s), "Resolve the encounter first.");
      this.#rule(s.player.strikes > 0, "You have no strikes to clear.");
      this.#rule(repOf(s, "council") >= 25, "Sal only helps allies (Council standing 25).");
      this.#rule(s.player.stats.cash >= 200, "The bailout costs $200.");
      this.#commit([{ type: "MODIFY_STATS", delta: { cash: -200 } }, { type: "CLEAR_STRIKE" }, ...this.#repOps({ council: -10 }),
        { type: "PHONE_MSG", from: "sal", text: "Done. One of my nephews knows a clerk. Stay clean." },
        ...seedOps(["Uncle Sal called in a favor to wipe a strike off the record"], { sal_bailout: true }),
        { type: "LOG", kind: "gain", event: "Uncle Sal wiped a strike off your record for $200." }]);
    });
  }
  /** Adds ledger lines and narrative seeds for faction shifts and hot districts, in the same atomic batch. */
  #annotate(ctx, batch) {
    const out = [], run = {}, dh = { ...ctx.world.districtHeat };
    FACTION_IDS.forEach((k) => { run[k] = ctx.world.factions[k].rep; });
    for (const o of batch) {
      if (o.type === "SHIFT_REP") for (const [k, d] of Object.entries(o.deltas)) {
        const old = run[k], nw = Math.max(-50, Math.min(50, Math.round(old + d))); run[k] = nw; if (nw === old) continue;
        const f = FACTIONS[k].name, up = nw > old, seeds = [`standing with the ${f} ${up ? "rose" : "fell"} on the block`];
        if (old > -25 && nw <= -25) seeds.push(`the ${f} put out word that you are marked`);
        if (old < 25 && nw >= 25) seeds.push(`earned the protection of the ${f}`);

    const contacts = Object.values(CONTACTS).map((k) => `<li class="py-1 border-b border-zinc-800"><b>${esc(k.name)}</b> <span class="text-zinc-400">${esc(k.role)}</span><div class="text-xs text-zinc-400">${esc(k.blurb)} Standing: ${standing(repOf(s, k.faction))}.</div></li>`).join("");

  muteBtn() {

  dataPanel() {

      <button class="btn" data-act="import">Restore from text</button>
      <button class="btn text-rose-400" data-act="wipe">${this.wipeArmed ? "Click again to wipe everything" : "Wipe all data"}</button>

  }
  showToast(msg) {
    this.toast = msg; clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => { this.toast = null; this.render(this.c.store.getState()); }, 2200);
    this.render(this.c.store.getState());
  }
  toastHtml() { return this.toast ? `<div role="status" class="fixed bottom-4 left-1/2 -translate-x-1/2 panel px-4 py-2 z-50 hd text-lg pointer-events-none">${esc(this.toast)}</div>` : ""; }
  async exportSave() {
    let text;
    try { text = this.c.exportText(); } catch (e) { this.showToast("Could not encode this save."); return; }
    try { await navigator.clipboard.writeText(text); this.showToast("Save Copied!"); }
    catch (e) { this.importText = text; this.showToast("Clipboard blocked. The save is in the box below; copy it from there."); }
  }
  importSaveText() {

        <aside class="panel p-3 overflow-y-auto max-h-[85vh]" aria-label="Chronicle"><h2 class="hd text-xl font-bold mb-1">Chronicle</h2><ul class="pr-1">${ledger}</ul></aside>
      </div>`;
    if (this.settingsOpen) this.root.insertAdjacentHTML("beforeend", this.drawer());
    if (this.phoneOpen) this.root.insertAdjacentHTML("beforeend", this.phone(s));
    if (s.meta.status !== "playing") this.root.insertAdjacentHTML("beforeend", this.epilogue(s));
    this.root.insertAdjacentHTML("beforeend", this.toastHtml());
    const fxEl = this.root.querySelector(".fx-hurt"); if (fxEl) fxEl.addEventListener("animationend", () => fxEl.remove());
    this.prev = { health: st.health, heat: st.heat, cash: st.cash, streetCred: st.streetCred, strikes: s.player.strikes };
    this.paintNotice();
  }
}

/* ============ BOOTSTRAP ============ */
try {
  const store = new GameState(defaultState), controller = new GameController(store), view = new GameView(document.getElementById("app"), controller);
  store.subscribe((next) => view.render(next));
  controller.load();
  view.render(store.getState());
} catch (e) {
  console.error(e);
  document.getElementById("app").textContent = "Street Stories failed to start: " + e.message;
}
</script>
</body>
</html>
